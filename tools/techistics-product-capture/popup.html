<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font:13px system-ui,sans-serif;color:#202720;background:#fff}body{width:410px;margin:0;padding:14px;box-sizing:border-box}
h1{font-size:18px;margin:0 0 5px}.muted{font-size:12px;color:#5b665d;line-height:1.4}
button{border:0;border-radius:7px;padding:9px 10px;background:#50665d;color:#fff;font-weight:650;cursor:pointer;margin-top:9px}
button.secondary{background:#e7eee8;color:#24342a}button:disabled{opacity:.5;cursor:wait}
button.full{width:100%}.field{display:block;font-weight:650;margin-top:10px}
input[type=text]{width:100%;box-sizing:border-box;border:1px solid #cbd3cc;border-radius:5px;padding:8px;font:13px system-ui;margin-top:4px}
#results{margin-top:12px}#source{font-size:11px;color:#68736b;overflow-wrap:anywhere;margin-top:5px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.toolbar button{margin:0}
#images{max-height:340px;overflow:auto;border:1px solid #e0e5e0;border-radius:6px;margin-top:6px}
.image-row{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #edf0ed;cursor:pointer}
.image-row:last-child{border-bottom:0}.image-row input{flex:none}.thumb{width:54px;height:54px;object-fit:contain;background:#f7f8f7;border-radius:4px;flex:none}.thumb.broken{visibility:hidden}
.details{min-width:0;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}.details strong{font-size:12px;font-weight:600}.details small{font-size:10px;color:#6b756e}
#status{font-size:12px;white-space:pre-wrap;line-height:1.45;margin-top:10px}
</style>
</head>
<body>
<h1>Product Image Saver</h1>
<div class="muted">Find images on almost any webpage, select the ones you want, and download them with clean sequential filenames. Scroll the page first if its images load as you scroll.</div>
<button id="scan" class="full">Find images on this page</button>
<div id="results" hidden>
<label class="field">Filename / folder prefix<input id="prefix" type="text" placeholder="Product-name"></label>
<div id="source"></div>
<div class="toolbar"><strong id="count">Images found</strong><button id="selectAll" class="secondary">Select none</button></div>
<div id="images"></div>
<button id="download" class="full">Download selected images</button>
<button id="rescan" class="secondary full">Scan again</button>
</div>
<div id="status" role="status"></div>
<script src="popup.js"></script>
</body>
</html>
