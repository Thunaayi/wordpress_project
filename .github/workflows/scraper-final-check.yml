name: Scraper syntax check
on:
  push:
    branches: ["fix/scraper-final"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node --check src/index.js
      - run: node --check src/utils/ProductExtractor.js
      - run: node --check src/config/sites.js
      - run: node --check src/scrapers/BaseScraper.js
